<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iOS 18 · Liquid Glass</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dark.css">
</head><body>
<div id="phone"><div id="screen">
  <div id="wall"></div>
  <div id="home"><div id="grid"></div><div id="dock" class="glass"></div></div>
  <div id="appwrap"></div>
  <div id="sw"></div>
  <div id="status"><span id="clk"></span><span id="sys"></span></div>
  <div id="tz"></div><div id="bar"></div>
  <div id="banner" class="glass"></div>
  <div id="shade" class="glass"><div id="bigclk"></div><div id="notifs"></div><div class="mp"></div></div>
  <div id="cc" class="glass">
    <div class="tgs">
      <button class="tb" data-t="wifi" style="--c:#007AFF">📶</button>
      <button class="tb" data-t="bt" style="--c:#007AFF">🔷</button>
      <button class="tb" data-t="air" style="--c:#FF9500">✈️</button>
      <button class="tb" data-t="torch" style="--c:#FFB800">🔦</button>
      <button class="tb" data-t="rot" style="--c:#FF3B30">🔒</button>
    </div>
    <div class="sls"><div class="sl" data-k="br"><i></i><span>☀️</span></div><div class="sl" data-k="vol"><i></i><span>🔊</span></div></div>
    <div class="mp"></div>
  </div>
  <div id="lock"><div id="lt"></div><div id="ld"></div><p>Scorri verso l'alto per sbloccare</p></div>
  <div id="island"></div>
  <div id="torch"></div><div id="dim"></div><div id="flash"></div>
</div></div>
<script src="main.js"></script><script src="apps.js"></script><script src="notifications.js"></script>
</body></html>
