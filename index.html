<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luminate OS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --glass-blur: blur(20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-family);
            font-weight: 700;
        }

        body {
            background: #090c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }

        /* Phone Frame Container */
        .phone-wrapper {
            position: relative;
            width: 390px;
            height: 830px;
            background: #000;
            border-radius: 54px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 0 2px 2px rgba(255,255,255,0.2);
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Screen Viewport */
        .phone-screen {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 44px;
            overflow: hidden;
            /* Xiaomi HyperOS Default Wallpaper Gradient */
            background: radial-gradient(circle at 80% 20%, #ff5252 0%, transparent 40%),
                        radial-gradient(circle at 20% 70%, #7c4dff 0%, transparent 50%),
                        radial-gradient(circle at 60% 90%, #00e5ff 0%, transparent 45%),
                        linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0d0e15 100%);
            background-size: 150% 150%;
            animation: wallpaperShift 15s ease infinite alternate;
        }

        @keyframes wallpaperShift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .dynamic-island.expanded {
            width: 340px;
            height: 75px;
            border-radius: 35px;
            top: 12px;
            background: rgba(15, 15, 20, 0.92);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* Status Bar */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 13px;
            font-weight: 800;
            z-index: 999;
            color: #fff;
            letter-spacing: -0.2px;
        }

        .status-bar-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .battery-icon {
            width: 22px;
            height: 11px;
            border: 1.5px solid #fff;
            border-radius: 4px;
            padding: 1px;
            position: relative;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3.5px;
            top: 2.5px;
            width: 2px;
            height: 4px;
            background: #fff;
            border-radius: 0 1px 1px 0;
        }

        .battery-level {
            width: 80%;
            height: 100%;
            background: #fff;
            border-radius: 1.5px;
        }

        /* Home View & Pages */
        .home-container {
            width: 100%;
            height: 100%;
            padding-top: 60px;
            padding-bottom: 95px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .clock-widget {
            text-align: center;
            margin-top: 15px;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .clock-widget .time {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
        }

        .clock-widget .date {
            font-size: 14px;
            font-weight: 800;
            margin-top: 6px;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            opacity: 0.85;
        }

        /* App Grid - Proportional & Liquid Glass */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px 16px;
            padding: 0 22px;
            margin-top: 25px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .app-item:active {
            transform: scale(0.88);
        }

        /* Liquid Glass Icon Style */
        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.08) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            position: relative;
            overflow: hidden;
        }

        .app-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 50%);
            pointer-events: none;
        }

        .app-label {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            letter-spacing: -0.1px;
        }

        /* Dock */
        .dock-container {
            margin: 0 16px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 32px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.5);
        }

        /* App Window Layer */
        .app-window {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1117;
            z-index: 2000;
            display: none;
            flex-direction: column;
            animation: appOpen 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            border-radius: 44px;
            overflow: hidden;
        }

        @keyframes appOpen {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .app-header {
            padding: 50px 20px 15px 20px;
            background: rgba(20, 20, 28, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
        }

        .app-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            color: #fff;
        }

        /* Home Indicator Gesture Bar */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 135px;
            height: 5px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            z-index: 9999;
            cursor: pointer;
            transition: background 0.2s;
        }

        .home-indicator:hover {
            background: #fff;
        }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <div class="phone-screen">
        
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="sb-time">22:31</span>
            <div class="status-bar-right">
                <span>5G</span>
                <div class="battery-icon"><div class="battery-level"></div></div>
            </div>
        </div>

        <!-- Dynamic Island -->
        <div class="dynamic-island" id="dynamic-island"></div>

        <!-- Home View -->
        <div class="home-container">
            <div class="clock-widget">
                <div class="time" id="widget-time">22:31</div>
                <div class="date" id="widget-date">Mercoledì, 21 Ottobre</div>
            </div>

            <!-- App Grid -->
            <div class="app-grid">
                <div class="app-item" onclick="openApp('calculator')">
                    <div class="app-icon" style="background: linear-gradient(135deg, rgba(255,149,0,0.6), rgba(255,149,0,0.2));">🧮</div>
                    <span class="app-label">Calcolatrice</span>
                </div>
                <div class="app-item" onclick="openApp('notes')">
                    <div class="app-icon" style="background: linear-gradient(135deg, rgba(255,204,0,0.6), rgba(255,204,0,0.2));">📝</div>
                    <span class="app-label">Note</span>
                </div>
                <div class="app-item" onclick="openApp('browser')">
                    <div class="app-icon" style="background: linear-gradient(135deg, rgba(0,122,255,0.6), rgba(0,122,255,0.2));">🌐</div>
                    <span class="app-label">Browser</span>
                </div>
                <div class="app-item" onclick="openApp('settings')">
                    <div class="app-icon" style="background: linear-gradient(135deg, rgba(142,142,147,0.6), rgba(142,142,147,0.2));">⚙️</div>
                    <span class="app-label">Impostazioni</span>
                </div>
            </div>

            <!-- Dock -->
            <div class="dock-container">
                <div class="app-item" onclick="openApp('phone')">
                    <div class="app-icon" style="background: linear-gradient(135deg, rgba(52,199,89,0.7), rgba(52,199,89,0.2));">📞</div>
                </div>
                <div class="app-item" onclick="openApp('messages')">
                    <div class="app-icon" style="background: linear-gradient(135deg, rgba(0,199,190,0.7), rgba(0,199,190,0.2));">💬</div>
                </div>
                <div class="app-item" onclick="openApp('spotify')">
                    <div class="app-icon" style="background: linear-gradient(135deg, rgba(30,215,96,0.7), rgba(30,215,96,0.2));">🎵</div>
                </div>
                <div class="app-item" onclick="openApp('camera')">
                    <div class="app-icon" style="background: linear-gradient(135deg, rgba(255,45,85,0.7), rgba(255,45,85,0.2));">📷</div>
                </div>
            </div>
        </div>

        <!-- Generic App Window Container -->
        <div class="app-window" id="app-window">
            <div class="app-header">
                <span class="app-title" id="app-title">App</span>
            </div>
            <div class="app-body" id="app-body">
                <!-- App Content Loaded Dynamically -->
            </div>
        </div>

        <!-- Home Gesture Bar -->
        <div class="home-indicator" onclick="closeApp()"></div>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const timeStr = `${hours}:${minutes}`;
        
        document.getElementById('sb-time').innerText = timeStr;
        document.getElementById('widget-time').innerText = timeStr;
        
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('widget-date').innerText = now.toLocaleDateString('it-IT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    function openApp(appName) {
        const win = document.getElementById('app-window');
        const title = document.getElementById('app-title');
        const body = document.getElementById('app-body');
        
        title.innerText = appName.charAt(0).toUpperCase() + appName.slice(1);
        body.innerHTML = `<p style="text-align:center; margin-top: 50px;">Benvenuto in ${appName}!</p>`;
        
        win.style.display = 'flex';
    }

    function closeApp() {
        document.getElementById('app-window').style.display = 'none';
    }
</script>

</body>
</html>
